plugins { id 'com.android.application' }

android {
    namespace 'com.amar.control'
    compileSdk 35

    defaultConfig {
        applicationId 'com.amar.control'
        minSdk 26
        targetSdk 30
        versionCode 4
        versionName '0.3.1-frida-port-fix'
    }

    signingConfigs {
        stableTest {
            storeFile file('../keystore/amar-control-test.jks')
            storePassword 'amarcontrol'
            keyAlias 'amarcontrol'
            keyPassword 'amarcontrol'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.stableTest }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'org.tukaani:xz:1.10'
}
